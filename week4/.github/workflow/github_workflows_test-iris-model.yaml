name: Run Iris Model Unit Tests

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy scikit-learn joblib

    - name: Run unit tests
      run: |
        python -m unittest test_iris_model.py -v

    - name: Comment test results
      if: always()
      uses: actions/github-script@v7
      with:
        script: |
          const result = `${{ job.status }}`;
          const output = await github.rest.actions.getJobForWorkflowRun({
            owner: context.repo.owner,
            repo: context.repo.repo,
            job_id: ${{ github.run_id }},
          });
          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.payload.pull_request ? context.payload.pull_request.number : context.payload.head_commit.id,
            body: `Unit Test Job ${result}\nDetails: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`
          })
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}